<svg viewBox="0 0 1160 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jenkins on EC2 builds and pushes two Lambda images to ECR and deploys the orchestrator Lambda, inference Lambda, S3 bucket and API Gateway; at request time a client calls API Gateway, which invokes the orchestrator Lambda, which invokes the inference Lambda asynchronously, which reads/writes S3, while the orchestrator polls S3 for the result.">
  <title>enterprise-platform architecture</title>
  <desc>Deploy-time: Jenkins on EC2 builds container images, pushes them to two ECR repos, and deploys the orchestrator Lambda, inference Lambda, S3 bucket and API Gateway. Request-time: a client calls API Gateway which proxy-invokes the orchestrator Lambda; the orchestrator invokes the inference Lambda asynchronously (fire-and-forget) so it stays under API Gateway's 30s timeout; the inference Lambda reads dummy_data.xlsx from S3 and writes its result back to S3; the orchestrator polls that same S3 result when the client re-calls with a request_id.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1160" height="900" fill="#ffffff"/>

  <!-- ================= boxes (drawn first so arrows/labels lay on top of edges, never under a fill) ================= -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Developer -->
    <rect x="500" y="20" width="160" height="50" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
    <text x="580" y="50" text-anchor="middle" font-size="13" fill="#0f172a">Developer</text>

    <!-- GitHub -->
    <rect x="500" y="110" width="160" height="50" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
    <text x="580" y="132" text-anchor="middle" font-size="13" fill="#0f172a">GitHub</text>
    <text x="580" y="148" text-anchor="middle" font-size="11.5" fill="#475569">dev branch</text>

    <!-- Jenkins -->
    <rect x="480" y="200" width="200" height="60" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
    <text x="580" y="225" text-anchor="middle" font-size="13" fill="#0f172a">Jenkins (EC2)</text>
    <text x="580" y="242" text-anchor="middle" font-size="11.5" fill="#475569">Enterprise-pipeline</text>

    <!-- ECR -->
    <rect x="900" y="190" width="220" height="60" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
    <text x="1010" y="213" text-anchor="middle" font-size="13" fill="#0f172a">ECR</text>
    <text x="1010" y="229" text-anchor="middle" font-size="11" fill="#475569">hello-world-lambda</text>
    <text x="1010" y="243" text-anchor="middle" font-size="11" fill="#475569">hello-world-inference-lambda</text>

    <!-- API Gateway -->
    <rect x="30" y="400" width="220" height="72" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
    <text x="140" y="426" text-anchor="middle" font-size="13" fill="#0f172a">API Gateway</text>
    <text x="140" y="443" text-anchor="middle" font-size="11" fill="#475569">/hello — API key +</text>
    <text x="140" y="457" text-anchor="middle" font-size="11" fill="#475569">usage plan (30s timeout)</text>

    <!-- Orchestrator Lambda -->
    <rect x="320" y="400" width="220" height="72" rx="6" fill="#eef2ff" stroke="#334155" stroke-width="1.6"/>
    <text x="430" y="426" text-anchor="middle" font-size="13" fill="#0f172a">Orchestrator Lambda</text>
    <text x="430" y="443" text-anchor="middle" font-size="11" fill="#475569">hello-world-lambda</text>
    <text x="430" y="457" text-anchor="middle" font-size="11" fill="#475569">FastAPI (Mangum), timeout 15s</text>

    <!-- Inference Lambda -->
    <rect x="660" y="400" width="220" height="72" rx="6" fill="#eef2ff" stroke="#334155" stroke-width="1.6"/>
    <text x="770" y="426" text-anchor="middle" font-size="13" fill="#0f172a">Inference Lambda</text>
    <text x="770" y="443" text-anchor="middle" font-size="11" fill="#475569">hello-world-inference-lambda</text>
    <text x="770" y="457" text-anchor="middle" font-size="11" fill="#475569">reads xlsx, timeout 60s</text>

    <!-- S3 -->
    <rect x="460" y="560" width="220" height="72" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
    <text x="570" y="586" text-anchor="middle" font-size="13" fill="#0f172a">S3 bucket</text>
    <text x="570" y="603" text-anchor="middle" font-size="11" fill="#475569">enterprise-bucket-&lt;account&gt;</text>
    <text x="570" y="617" text-anchor="middle" font-size="11" fill="#475569">dummy_data.xlsx, results/*.json</text>

    <!-- Client -->
    <rect x="30" y="560" width="220" height="60" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
    <text x="140" y="595" text-anchor="middle" font-size="13" fill="#0f172a">Client</text>
  </g>

  <!-- ================= deploy-time (dashed) arrows ================= -->
  <g stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow)">
    <line x1="580" y1="70" x2="580" y2="108"/>
    <line x1="580" y1="160" x2="580" y2="198"/>
    <path d="M680,222 C 780,222 820,220 898,220"/>
    <path d="M520,260 C 485,310 455,350 432,398"/>
    <path d="M640,260 C 700,310 740,350 762,398"/>
    <path d="M480,225 L140,225 L140,398"/>
    <path d="M700,235 C 900,270 1000,330 1000,480 C 1000,540 900,558 682,585"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#475569">
    <text x="588" y="93">git push (dev branch)</text>
    <text x="588" y="183">Build Now / SCM pulls dev</text>
    <text x="710" y="212">docker push image (×2 repos)</text>
    <text x="345" y="325" text-anchor="middle">deploy: create/update</text>
    <text x="345" y="340" text-anchor="middle">function (image from ECR)</text>
    <text x="838" y="325" text-anchor="middle">deploy: create/update</text>
    <text x="838" y="340" text-anchor="middle">function (image from ECR)</text>
    <text x="150" y="300">create REST API + /hello</text>
    <text x="150" y="315">route + API key + usage plan</text>
    <text x="895" y="450">create bucket +</text>
    <text x="895" y="465">upload dummy_data.xlsx</text>
  </g>

  <!-- ================= runtime (solid) arrows ================= -->
  <g stroke="#1e293b" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <line x1="140" y1="558" x2="140" y2="472"/>
    <line x1="252" y1="435" x2="318" y2="435"/>
    <path d="M770,472 C 700,520 650,545 622,558"/>
    <path d="M425,472 C 450,510 470,535 495,558"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a">
    <text x="150" y="520">GET /hello</text>
    <text x="150" y="535">[?request_id]</text>
    <text x="285" y="424" text-anchor="middle">proxy</text>
    <text x="285" y="452" text-anchor="middle">invoke</text>
    <text x="690" y="520" text-anchor="middle">GetObject xlsx /</text>
    <text x="690" y="535" text-anchor="middle">PutObject result</text>
    <text x="450" y="520">GetObject</text>
    <text x="450" y="535">result (poll)</text>
  </g>

  <!-- highlighted async-invoke arrow: the mechanism that keeps the orchestrator under API Gateway's 30s limit -->
  <line x1="540" y1="425" x2="656" y2="425" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-accent)"/>
  <text x="598" y="415" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#ea580c">invoke async (Event)</text>

  <!-- ================= legend ================= -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    <line x1="30" y1="700" x2="70" y2="700" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="80" y="704" fill="#334155">deploy-time (Jenkins pipeline)</text>

    <line x1="30" y1="726" x2="70" y2="726" stroke="#1e293b" stroke-width="1.8"/>
    <text x="80" y="730" fill="#334155">request-time (runtime call)</text>

    <line x1="30" y1="752" x2="70" y2="752" stroke="#ea580c" stroke-width="3"/>
    <text x="80" y="756" fill="#ea580c">async invoke — the hop that avoids the 30s API Gateway timeout</text>
  </g>
</svg>
