<svg viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Alternative architecture: the orchestrator Lambda sends a message to an SQS queue instead of invoking the inference Lambda directly. The inference Lambda is triggered by SQS via an event source mapping; messages that fail repeatedly move to a dead-letter queue instead of being silently dropped. Orchestrator and inference both still read/write S3 for the job result.">
  <title>enterprise-platform architecture — SQS-decoupled option</title>
  <desc>Client calls API Gateway, which proxy-invokes the orchestrator Lambda. Instead of invoking the inference Lambda directly, the orchestrator sends a message to an SQS queue (hello-world-jobs). The inference Lambda is triggered by that queue via an event source mapping. The inference Lambda reads dummy_data.xlsx from S3 and writes its result back to S3, same as the direct-invoke design. Messages SQS can't deliver successfully after repeated attempts move to a dead-letter queue instead of vanishing. The orchestrator still polls S3 directly for the result.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrow-warn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="600" fill="#ffffff"/>

  <!-- ================= boxes ================= -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Client -->
    <rect x="30" y="180" width="170" height="90" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.4"/>
    <text x="115" y="230" text-anchor="middle" font-size="13" fill="#0f172a">Client</text>

    <!-- API Gateway -->
    <rect x="230" y="180" width="190" height="90" rx="6" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
    <text x="325" y="212" text-anchor="middle" font-size="13" fill="#0f172a">API Gateway</text>
    <text x="325" y="230" text-anchor="middle" font-size="11" fill="#475569">/hello — API key +</text>
    <text x="325" y="245" text-anchor="middle" font-size="11" fill="#475569">usage plan (30s timeout)</text>

    <!-- Orchestrator Lambda -->
    <rect x="450" y="180" width="210" height="90" rx="6" fill="#eef2ff" stroke="#334155" stroke-width="1.6"/>
    <text x="555" y="212" text-anchor="middle" font-size="13" fill="#0f172a">Orchestrator Lambda</text>
    <text x="555" y="230" text-anchor="middle" font-size="11" fill="#475569">hello-world-lambda</text>
    <text x="555" y="245" text-anchor="middle" font-size="11" fill="#475569">FastAPI (Mangum), timeout 15s</text>

    <!-- SQS Queue -->
    <rect x="690" y="180" width="210" height="90" rx="6" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
    <text x="795" y="212" text-anchor="middle" font-size="13" fill="#0f172a">SQS Queue</text>
    <text x="795" y="230" text-anchor="middle" font-size="11" fill="#475569">hello-world-jobs</text>
    <text x="795" y="245" text-anchor="middle" font-size="11" fill="#475569">visibility timeout 90s</text>

    <!-- Inference Lambda -->
    <rect x="930" y="180" width="210" height="90" rx="6" fill="#eef2ff" stroke="#334155" stroke-width="1.6"/>
    <text x="1035" y="212" text-anchor="middle" font-size="13" fill="#0f172a">Inference Lambda</text>
    <text x="1035" y="230" text-anchor="middle" font-size="11" fill="#475569">hello-world-inference-lambda</text>
    <text x="1035" y="245" text-anchor="middle" font-size="11" fill="#475569">SQS trigger, batch size 1</text>

    <!-- S3 -->
    <rect x="690" y="380" width="230" height="90" rx="6" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
    <text x="805" y="412" text-anchor="middle" font-size="13" fill="#0f172a">S3 bucket</text>
    <text x="805" y="430" text-anchor="middle" font-size="11" fill="#475569">enterprise-bucket-&lt;account&gt;</text>
    <text x="805" y="445" text-anchor="middle" font-size="11" fill="#475569">dummy_data.xlsx, results/*.json</text>

    <!-- DLQ -->
    <rect x="950" y="380" width="200" height="90" rx="6" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="1050" y="412" text-anchor="middle" font-size="13" fill="#7f1d1d">Dead-Letter Queue</text>
    <text x="1050" y="430" text-anchor="middle" font-size="11" fill="#991b1b">hello-world-jobs-dlq</text>
    <text x="1050" y="445" text-anchor="middle" font-size="11" fill="#991b1b">captures poison messages</text>
  </g>

  <!-- ================= row 1: main request/handoff flow ================= -->
  <g stroke="#1e293b" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <line x1="200" y1="225" x2="228" y2="225"/>
    <line x1="420" y1="225" x2="448" y2="225"/>
    <line x1="898" y1="225" x2="928" y2="225"/>
  </g>
  <line x1="660" y1="225" x2="688" y2="225" stroke="#ea580c" stroke-width="3" marker-end="url(#arrow-accent)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#0f172a">
    <text x="214" y="160" text-anchor="middle">GET /hello</text>
    <text x="214" y="175" text-anchor="middle">[?request_id]</text>
    <text x="434" y="167" text-anchor="middle">proxy</text>
    <text x="434" y="182" text-anchor="middle">invoke</text>
    <text x="674" y="160" text-anchor="middle" font-weight="600" fill="#ea580c">SendMessage</text>
    <text x="674" y="175" text-anchor="middle" font-weight="600" fill="#ea580c">{request_id}</text>
    <text x="913" y="160" text-anchor="middle">event source</text>
    <text x="913" y="175" text-anchor="middle">mapping (poll)</text>
  </g>

  <!-- ================= diagonals down to S3 / DLQ ================= -->
  <g stroke="#1e293b" stroke-width="1.8" fill="none" marker-end="url(#arrow)">
    <path d="M545,270 C 620,315 680,345 730,378"/>
    <path d="M1005,270 C 950,315 900,345 870,378"/>
  </g>
  <path d="M810,270 C 870,310 930,340 1010,378" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 5" fill="none" marker-end="url(#arrow-warn)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0f172a">
    <text x="600" y="330" text-anchor="middle">GetObject</text>
    <text x="600" y="344" text-anchor="middle">result (poll)</text>
    <text x="1050" y="292" text-anchor="middle">GetObject xlsx /</text>
    <text x="1050" y="306" text-anchor="middle">PutObject result</text>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#7f1d1d">
    <text x="828" y="294" text-anchor="middle">after maxReceiveCount</text>
    <text x="828" y="308" text-anchor="middle">failed receives</text>
  </g>

  <!-- ================= legend ================= -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
    <line x1="30" y1="520" x2="70" y2="520" stroke="#1e293b" stroke-width="1.8"/>
    <text x="80" y="524" fill="#334155">normal runtime call</text>

    <line x1="30" y1="546" x2="70" y2="546" stroke="#ea580c" stroke-width="3"/>
    <text x="80" y="550" fill="#ea580c">SendMessage — decouples orchestrator from inference (replaces direct async invoke)</text>

    <line x1="30" y1="572" x2="70" y2="572" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 5"/>
    <text x="80" y="576" fill="#334155">failure path — poison messages land in the DLQ instead of vanishing</text>
  </g>
</svg>
